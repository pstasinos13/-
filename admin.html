<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ο Σινεφίλος Admin</title>
</head>

<body style="margin:0;background:#111;color:white;font-family:Arial;">

<div style="max-width:900px;margin:auto;padding:32px;">
  <h1>🎬 Ο Σινεφίλος — Admin</h1>

  <div style="display:flex;gap:10px;margin-bottom:20px;">
    <input
      id="imdb"
      placeholder="IMDb link..."
      style="flex:1;padding:12px;border-radius:12px;border:none;"
    />

    <button
      onclick="addMovie()"
      style="padding:12px 20px;border:none;border-radius:12px;"
    >
      Add
    </button>
  </div>

  <p>
    Αντιγράφεις IMDb link → Add
  </p>
</div>

<script>
function addMovie() {
  alert("Θα βάλουμε το επόμενο βήμα αμέσως μετά.");
}
</script>

</body>
</html>
