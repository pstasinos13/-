<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ο Σινεφίλος</title>
</head>

<body style="margin:0;background:#111;color:white;font-family:Arial;">

<div style="max-width:900px;margin:auto;padding:32px;">
  <h1>🎬 Ο Σινεφίλος</h1>

  <div style="display:flex;gap:10px;margin-bottom:20px;">
    <input
      id="imdb"
      placeholder="IMDb link..."
      style="flex:1;padding:12px;border-radius:12px;border:none;"
    />

    <button
      onclick="addMovie()"
      style="padding:12px 20px;border:none;border-radius:12px;cursor:pointer;"
    >
      Add
    </button>
  </div>

  <div id="movies"></div>
</div>

<script>
const API_KEY = "faa7b4d1";

let movies =
  JSON.parse(localStorage.getItem("movies") || "[]");

render();

async function addMovie() {
  const imdbLink =
    document.getElementById("imdb").value;

  const match = imdbLink.match(/tt\d+/);

  if (!match) return;

  const imdbId = match[0];

  const res = await fetch(
    "https://www.omdbapi.com/?apikey=" +
      API_KEY +
      "&i=" +
      imdbId
  );

  const data = await res.json();

  if (data.Response === "False") return;

  movies.push({
    title: data.Title,
    year: data.Year,
    poster: data.Poster,
    imdb: imdbLink,
    rating: data.imdbRating,
    genre: data.Genre
  });

  movies.sort((a, b) =>
    a.title.localeCompare(b.title, "el")
  );

  save();
  render();

  document.getElementById("imdb").value = "";
}

function save() {
  localStorage.setItem(
    "movies",
    JSON.stringify(movies)
  );
}

function render() {
  document.getElementById("movies").innerHTML =
    movies
      .map(
        (movie) => `
      <div style="
        display:flex;
        gap:16px;
        margin-bottom:20px;
        background:#1a1a1a;
        padding:16px;
        border-radius:16px;
      ">

        <img
          src="${movie.poster}"
          width="90"
          style="border-radius:10px;"
        />

        <div>
          <a
            href="${movie.imdb}"
            target="_blank"
            style="
              color:white;
              font-size:20px;
              text-decoration:none;
            "
          >
            ${movie.title}
          </a>

          <div style="opacity:.8;">
            ${movie.year}
          </div>

          <div>
            ⭐ IMDb: ${movie.rating}
          </div>

          <div style="opacity:.8;">
            🎭 ${movie.genre}
          </div>
        </div>
      </div>
    `
      )
      .join("");
}
</script>

</body>
</html>
